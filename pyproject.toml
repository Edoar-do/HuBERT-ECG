[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hubert-ecg"
version = "1.0.0"
description = "HuBERT-ECG: Self-supervised foundation model for 12-lead ECG analysis"
readme = "README.md"
license = { text = "CC BY-NC 4.0" }
requires-python = ">=3.9"
authors = [
    { name = "Edoardo Coppola" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors>=0.4",
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "loguru>=0.7",
    "tqdm>=4.65",
    "wandb>=0.16",
    "torchmetrics>=1.2",
    "torcheval>=0.0.7",
    "neurokit2>=0.2",
    "biosppy>=2.2",
    "iterative-stratification>=0.1.9",
    "peakutils>=1.3",
    "matplotlib>=3.6",
    "opencv-python-headless>=4.6",
    "python-speech-features>=0.6",
]

[project.scripts]
hubert-ecg-pretrain  = "scripts.pretrain:main"
hubert-ecg-finetune  = "scripts.finetune:main"
hubert-ecg-evaluate  = "scripts.evaluate:main"
hubert-ecg-convert   = "scripts.convert_checkpoint:main"

[tool.setuptools.packages.find]
include = ["hubert_ecg*", "scripts*"]
